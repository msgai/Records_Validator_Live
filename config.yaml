# Select qa or prod. Passwords are read from .env, never stored in this file.
environment: prod

environments:
  qa:
    aurora:
      host: usqa-rds-analytics-new-cluster.cluster-ro-cepdepk4o3on.us-east-1.rds.amazonaws.com
      port: 3306
      user: analytics_svc
      database: staging
      password_env: AURORA_PASSWORD
      ssl:
        ca: ./certs/global-bundle.pem
      connect_timeout: 10
      read_timeout: 300
    clickhouse:
      host: 101.0.181.108
      port: 8123
      user: readonly_user
      password_env: CLICKHOUSE_PASSWORD
      secure: false
      connect_timeout: 10
      read_timeout: 300
  prod:
    aurora:
      host: usprod-analytics-aurora-db-cluster.cluster-cepdepk4o3on.us-east-1.rds.amazonaws.com
      port: 3306
      user: vruturajsinh-jadeja
      database: staging
      password_env: AURORA_PROD_PASSWORD
      ssl:
        ca: ./certs/global-bundle.pem
      connect_timeout: 10
      read_timeout: 300
    clickhouse:
      host: 101.0.133.2
      port: 8123
      user: vruturajsinhjadeja
      password_env: CLICKHOUSE_PROD_PASSWORD
      # This production endpoint uses HTTP; prefer HTTPS or a trusted tunnel.
      secure: false
      connect_timeout: 10
      read_timeout: 300

output_dir: ./comparison_reports
queries_file: queries.yaml

# Set count_only to true globally or per table to only count total records across chunks (smoke test)
# count_only: true

